services:
  postgres:
    image: postgres:16-alpine
    container_name: vet_clinic_db
    environment:
      POSTGRES_USER: vet_user
      POSTGRES_PASSWORD: vet_password
      POSTGRES_DB: vet_db
    ports:
      - "12300:5432"
    volumes:
      - postgres_vet_data:/var/lib/postgresql/data

volumes:
  postgres_vet_data: